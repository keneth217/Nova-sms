    from: ${MAIL_FROM:novastackt@gmail.com}
  jwt:
    secret: NovastackSmsGatewayJwtSecretKeyThatIsLongEnoughForHS256ProductionUse2026
    expiration-ms: 86400000
  sms:
    default-cost: 1.00
    platform-sender-id: NOVASTACK
